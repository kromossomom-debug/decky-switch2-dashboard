<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switch 2 Dashboard demo</title>
<style>
/*HOME_CSS*/

html, body { margin: 0; background: #0d0d0f; overflow: hidden; }
body { font-family: "Nunito Sans", "Noto Sans", sans-serif; color: #fff; }

/* The console screen: 1280x800 like the Steam Deck. The plugin's vh units are converted to px for it below. */
#screen { position: absolute; width: 1280px; height: 800px; overflow: hidden; }
#screen .s2d-root { height: 800px; }

/* Animations are driven by the timeline (see frame()), so every captured frame is exact. */
.s2d-tile.s2d-focused::after, .s2d-user.s2d-focused::after {
  animation: none !important; border-color: var(--pulse); transform: scale(var(--pop));
}
.s2d-icon.s2d-focused::before { animation: none !important; transform: rotate(var(--spin)) scale(var(--pop)); }
.s2d-row, .s2d-library-grid { scroll-behavior: auto; }
.s2d-hints .s2d-hint.s2d-callout { transform: scale(var(--callout)); transform-origin: center; }

/* ---------- video mode: 1920x1080 with captions and title cards ---------- */
body.video { width: 1920px; height: 1080px; background: radial-gradient(ellipse at 50% 35%, #26262b 0%, #121214 60%, #0b0b0c 100%); }
body.video #screen {
  left: 320px; top: 85px; transform: scale(1.15); transform-origin: 50% 50%;
  border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.06);
}
#caption {
  position: absolute; left: 0; right: 0; top: 990px; text-align: center;
  font-size: 40px; font-weight: 700; letter-spacing: 0.005em; color: #fff;
}
#caption b { color: #00c3e3; font-weight: 800; }
.card {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; opacity: 0;
}
.card h1 { margin: 0; font-size: 112px; font-weight: 800; letter-spacing: -0.01em; }
.card h1 span { color: #00c3e3; }
.card p { margin: 22px 0 0; font-size: 40px; color: rgba(255,255,255,0.82); font-weight: 600; }
.card .small { font-size: 26px; color: rgba(255,255,255,0.5); margin-top: 48px; font-weight: 500; }
.card .url {
  margin-top: 40px; font-size: 38px; font-weight: 700; color: #fff; padding: 18px 36px; border-radius: 999px;
  background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 3px #00c3e3;
}
.card .steps { margin-top: 36px; font-size: 30px; color: rgba(255,255,255,0.75); line-height: 1.6; font-weight: 600; }
.card .coffee {
  margin-top: 34px; display: inline-flex; align-items: center; gap: 16px; padding: 16px 34px; border-radius: 999px;
  background: #ffdd00; color: #111; font-size: 34px; font-weight: 800;
}
.card .coffee svg { width: 38px; height: 38px; }
.card .coffee span { font-weight: 600; opacity: 0.75; }
#dip { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
body:not(.video) #caption, body:not(.video) .card { display: none; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="dip"></div>
<div id="caption"></div>
<div class="card" id="title">
  <h1>Switch 2 <span>Dashboard</span></h1>
  <p>A Switch 2–style HOME Menu for SteamOS Game Mode</p>
  <div class="small">Decky Loader plugin · free and open source</div>
</div>
<div class="card" id="outro">
  <h1>Get it <span>free</span></h1>
  <div class="url">github.com/kromossomom-debug/decky-switch2-dashboard</div>
  <div class="steps">Decky → Developer mode → Install plugin from ZIP</div>
  <div class="coffee" id="coffee"></div>
  <div class="small">Unofficial fan project. Not affiliated with Nintendo or Valve.</div>
</div>
<script>
/*ICONS*/
/*LIBRARY*/

// ---------- data ----------
// The HOME Menu row: the most recent games (software like DSX is in All Software, not in the row).
const GAMES = LIBRARY.filter((g) => g.name !== "DSX").slice(0, 11);
const SHORTCUTS = [
  ["online", "Steam Online"], ["chat", "Chat"], ["news", "News"], ["store", "Steam Store"], ["album", "Album"],
  ["share", "Remote Play"], ["controllers", "Controllers"], ["cards", "Library"], ["settings", "System Settings"],
  ["sleep", "Sleep Mode"],
];
const LIB_TOTAL = 218; // the size of the author's library; the grid shows its 42 most recent titles
const ALL = GAMES.length; // index of the All Software tile
const SORT_LABEL = { recent: "Last played", playtime: "Play time", title: "Title" };
const SORTED = {
  recent: LIBRARY,
  playtime: [...LIBRARY].sort((a, b) => b.minutes - a.minutes),
  title: [...LIBRARY].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" })),
};

// ---------- timeline (seconds) ----------
const LIB_OPEN = 16.0, LIB_CLOSE = 28.0;   // All Software
const PAGE_OPEN = 40.0, PAGE_CLOSE = 55.8; // My Page
/** Times of the HOME Menu tour after 16 s, moved past the All Software (+13 s) and My Page (+26 s) scenes. */
const T = (x) => x + (x < 27 ? 13 : 26);
const FOCUS = [[0, "tiles", 0]];                      // HOME Menu focus: [time, row, index]
const at = (t, row, i) => FOCUS.push([t, row, i]);
for (let i = 1; i <= ALL; i++) at(5.0 + (i - 1) * 0.8, "tiles", i);       // across the row to All Software
at(T(16.0), "icons", 9);                                                  // down to the round icons
for (let i = 8; i >= 0; i--) at(T(16.0) + (9 - i) * 0.9, "icons", i);     // left across all ten
at(T(25.0), "tiles", 8);                                                  // up to the row
at(T(25.8), "user", 0);                                                   // up to My Page
at(T(30.5), "tiles", 8);                                                  // back down
for (let i = 7; i >= 0; i--) at(T(31.0) + (7 - i) * 0.4, "tiles", i);     // quickly back to the first game
at(T(37.8), "tiles", 1); at(T(38.6), "tiles", 2); at(T(39.4), "tiles", 3); // white theme
at(T(40.4), "icons", 9); at(T(41.3), "icons", 8); at(T(42.2), "icons", 7);
at(T(45.4), "tiles", 2); at(T(46.4), "tiles", 1);                        // non-Steam games with custom art
// All Software: [time, index] and sort changes [time, order]; a new order starts again at the first title.
const LFOCUS = [[LIB_OPEN, 0], [17.2, 1], [17.9, 2], [18.6, 3], [19.4, 9], [20.2, 15], [21.0, 21], [21.8, 20], [24.5, 0], [26.3, 0]];
const SORTS = [[0, "recent"], [24.5, "playtime"], [26.3, "title"]];
const SCREENS = [[0, "home"], [LIB_OPEN, "library"], [LIB_CLOSE, "home"], [PAGE_OPEN, "mypage"], [PAGE_CLOSE, "home"]];
const THEME = [[0, "black"], [T(36.8), "white"], [T(44.8), "black"]];
const DIPS = [T(36.5), T(44.5)];                                          // short fades around theme changes
const CAPTIONS = [
  [4.5, 9.0, "Your recent games as big <b>square tiles</b>"],
  [9.0, 13.5, "The selected game's name sits above it, with a <b>pulsing frame</b>"],
  [13.5, 16.3, "Press <b>A</b> on <b>All Software</b>…"],
  [16.3, 20.6, "…for your <b>whole library</b>, six to a row"],
  [20.6, 24.3, "Games that aren't installed are <b>dimmed, with a cloud</b>"],
  [24.3, 28.0, "<b>Y</b> sorts by last played, play time or title · <b>B</b> goes back"],
  [T(16.0), T(25.0), "<b>Ten round shortcuts</b> in the console's order, each mapped to Steam"],
  [T(25.0), 40.3, "<b>Clock, Wi-Fi and battery</b> up top · <b>A</b> on your icon…"],
  [40.3, 45.2, "…opens <b>My Page</b>: profile, friend code and <b>play activity</b>"],
  [45.2, 49.6, "<b>Friend List</b>: who's online and what they're playing"],
  [49.6, 51.0, "<b>Add Friend</b> with your Steam friend code"],
  [51.0, PAGE_CLOSE, "<b>User Settings</b>: profile, icon, privacy and account · <b>B</b> goes back"],
  [T(30.5), T(36.5), "<b>A</b> starts the game · <b>☰</b> opens Steam's game menu"],
  [T(36.5), T(44.5), "<b>Basic Black</b> and <b>Basic White</b> themes"],
  [T(44.5), T(50.5), "Custom <b>SteamGridDB</b> art and <b>non-Steam games</b> show up too"],
  [T(50.5), T(50.5) + 4, "Quick Access → Decky: theme, tile art, row size and <b>12/24-hour clock</b>"],
];
// My Page: [time, area, index]; the menu's focus picks the section on the right, like the console.
const PFOCUS = [[PAGE_OPEN, "menu", 0], [41.6, "pane", 0], [42.3, "pane", 1], [43.0, "pane", 2], [43.7, "pane", 3], [44.4, "pane", 4],
  [45.2, "menu", 0], [45.9, "menu", 1], [46.8, "pane", 0], [47.5, "pane", 1], [48.2, "pane", 5], [49.0, "menu", 1],
  [49.6, "menu", 2], [51.0, "menu", 3], [52.0, "pane", 0], [52.7, "pane", 1], [53.4, "pane", 2], [54.1, "pane", 3]];
const CLOCK = [[0, "24"], [T(50.5) + 1.6, "12"]];
// Footer hints that pulse while their caption is up: [from, to, screen, glyph].
const CALLOUTS = [[T(31.0), T(36.0), "home", "☰"], [T(31.0), T(36.0), "home", "A"], [24.4, 27.9, "library", "Y"], [24.4, 27.9, "library", "B"], [51.0, PAGE_CLOSE - 0.1, "mypage", "B"]];
const OUTRO = T(50.5) + 5.1;
const DURATION = OUTRO + 6.4;

// My Page sample data: your play activity comes from the library above; the friends are made up for the demo.
const FRIEND_CODE = "87654321";
const ACTIVITY = LIBRARY.slice(0, 12).map((g, i) => ({
  ...g,
  played: g.minutes < 60 ? "Played for less than an hour" : `Played for ${Math.floor(g.minutes / 60)} hours or more`,
  last: i === 0 ? "today" : i === 1 ? "yesterday" : `${i + 1} days ago`,
}));
const FRIENDS = [
  ["Rafa", "playing", "Playing Counter-Strike 2", "#e4572e"],
  ["Bia", "playing", "Playing Hogwarts Legacy", "#8e5cd9"],
  ["Caio", "online", "Online", "#2a9d8f"],
  ["Duda", "online", "Online", "#e9a23b"],
  ["Enzo", "", "Last online 2 hours ago", "#3a86ff"],
  ["Lia", "", "Last online yesterday", "#ef476f"],
  ["Nina", "", "Last online 3 days ago", "#06a77d"],
  ["Teo", "", "Last online 5 days ago", "#6c757d"],
];
const MENU = [["profile", "Profile", ICONS.person], ["friends", "Friend List", ICONS.people], ["add", "Add Friend", ICONS.personAdd], ["settings", "User Settings", ICONS.gear]];
const option = (title, sub, art) => `<div class="s2d-option">${art ? `<div class="s2d-option-art"><img src="assets/${art}.jpg"></div>` : ""}<div class="s2d-option-text"><div class="s2d-option-title">${title}</div>${sub ? `<div class="s2d-option-sub">${sub}</div>` : ""}</div>${art ? "" : `<span class="s2d-chevron">${ICONS.chevron}</span>`}</div>`;
const PANES = {
  profile: `<div class="s2d-profile"><div class="s2d-profile-avatar">${ICONS.person}</div><div><div class="s2d-profile-name">Player</div><div class="s2d-presence s2d-online">Online</div><div class="s2d-profile-code">Friend code: <b>${FRIEND_CODE}</b></div></div></div>
    <div class="s2d-section">Play Activity</div>
    ${ACTIVITY.map((g) => option(g.name, `${g.played} · Last played: ${g.last}`, g.art ? g.appid : null)).join("")}`,
  friends: `<div class="s2d-friends">${FRIENDS.map(([n, kind, status, color]) => `<div class="s2d-friend ${kind ? "s2d-" + kind : ""}"><div class="s2d-friend-avatar" style="background:${color};color:#fff">${ICONS.person}</div><div class="s2d-friend-name">${n}</div><div class="s2d-friend-status">${status}</div></div>`).join("")}</div>`,
  add: `<div class="s2d-code-box"><div class="s2d-code-label">Friend code</div><div class="s2d-code">${FRIEND_CODE}</div></div>
    ${option("Search with friend code")}${option("Received friend requests (2)")}${option("Sent friend requests")}`,
  settings: `${option("Edit profile")}${option("Change icon")}${option("Privacy settings")}${option("Steam account")}`,
};

// ---------- the three screens ----------
const tile = (g, i, row, archive) => `<div class="s2d-tile ${archive && !g.installed ? "s2d-archived" : ""}" data-row="${row}" data-i="${i}"><div class="s2d-label">${g.name}</div><div class="s2d-tile-art">${g.art ? `<img src="assets/${g.appid}.jpg">` : `<div class="s2d-tile-text">${g.name}</div>`}</div>${archive && !g.installed ? `<div class="s2d-badge">${ICONS.cloud}</div>` : ""}</div>`;
const tray = `<div class="s2d-tray"><div class="s2d-clock">10:09</div><div class="s2d-wifi">${ICONS.wifi}</div><div class="s2d-battery"><span>80%</span><div class="s2d-battery-icon"><div class="s2d-battery-fill" style="width:80%"></div></div></div></div>`;
const footer = (hints) => `<div class="s2d-footer">
    <svg class="s2d-handheld" viewBox="0 0 70 36" fill="none" stroke="currentColor" stroke-width="3"><rect x="2" y="2" width="66" height="32" rx="10"/><rect x="18" y="7" width="34" height="22" rx="2"/><circle cx="10" cy="13" r="2.4" fill="currentColor" stroke="none"/><circle cx="60" cy="23" r="2.4" fill="currentColor" stroke="none"/></svg>
    <div class="s2d-hints">${hints.map(([g, l]) => `<div class="s2d-hint" data-glyph="${g}"><span class="s2d-glyph">${g}</span><span class="s2d-hint-label">${l}</span></div>`).join("")}</div>
  </div>`;

const screen = document.getElementById("screen");
screen.innerHTML = `
<div class="s2d-root s2d-black" id="home">
  <div class="s2d-main">
    <div class="s2d-status">
      <div class="s2d-users"><div class="s2d-user" data-row="user" data-i="0"><div class="s2d-label">Player</div>${ICONS.person}</div></div>
      ${tray}
    </div>
    <div class="s2d-row">
      ${GAMES.map((g, i) => tile(g, i, "tiles", false)).join("")}
      <div class="s2d-tile s2d-all" data-row="tiles" data-i="${ALL}"><div class="s2d-label">All Software</div><div class="s2d-tile-art"><div class="s2d-grid">${"<span></span>".repeat(9)}</div></div></div>
    </div>
    <div class="s2d-icons">
      ${SHORTCUTS.map(([id, label], i) => `<div class="s2d-icon" data-row="icons" data-i="${i}"><div class="s2d-label">${label}</div><div class="s2d-icon-face">${ICONS[id]}</div></div>`).join("")}
    </div>
  </div>
  ${footer([["☰", "Options"], ["A", "Start"]])}
</div>
<div class="s2d-root s2d-black s2d-library" id="library">
  <div class="s2d-status">
    <div class="s2d-title">All Software<span class="s2d-count">${LIB_TOTAL}</span></div>
    ${tray}
  </div>
  <div class="s2d-library-grid"></div>
  ${footer([["B", "Back"], ["Y", "Sort: Last played"], ["☰", "Options"], ["A", "Start"]])}
</div>
<div class="s2d-root s2d-black s2d-mypage" id="mypage">
  <div class="s2d-status">
    <div class="s2d-title"><div class="s2d-title-avatar">${ICONS.person}</div>Player's Page</div>
    ${tray}
  </div>
  <div class="s2d-page">
    <div class="s2d-menu">${MENU.map(([id, label, icon], i) => `<div class="s2d-menu-item" data-tab="${id}" data-i="${i}">${icon}${label}</div>`).join("")}</div>
    <div class="s2d-pane"></div>
  </div>
  ${footer([["B", "Back"], ["A", "OK"]])}
</div>`;
document.getElementById("coffee").innerHTML = `${ICONS.coffee} Buy me a coffee <span>buymeacoffee.com/kromossomoc</span>`;
const home = document.getElementById("home");
const library = document.getElementById("library");
const row = home.querySelector(".s2d-row");
const grid = library.querySelector(".s2d-library-grid");
const sortHint = library.querySelector('[data-glyph="Y"] .s2d-hint-label');
const mypage = document.getElementById("mypage");
const pane = mypage.querySelector(".s2d-pane");
const menuItems = [...mypage.querySelectorAll(".s2d-menu-item")];
const SCREEN_EL = { home, library, mypage };
let shownSort = null;
let shownTab = null;

function showTab(tab) {
  if (shownTab === tab) return;
  shownTab = tab;
  pane.innerHTML = PANES[tab];
  for (const el of menuItems) el.classList.toggle("s2d-active", el.dataset.tab === tab);
}
/** My Page's section: the one the menu last had focus on. */
const tabAt = (t) => MENU[lastBefore(PFOCUS.filter((e) => e[1] === "menu"), t)[2]][0];
const paneItems = () => [...pane.querySelectorAll(".s2d-option, .s2d-friend")];

function showSort(order) {
  if (shownSort === order) return;
  shownSort = order;
  grid.innerHTML = SORTED[order].map((g, i) => tile(g, i, "lib", true)).join("");
  sortHint.textContent = `Sort: ${SORT_LABEL[order]}`;
}

// ---------- frame rendering ----------
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const lastBefore = (list, t) => { let cur = list[0]; for (const e of list) if (e[0] <= t) cur = e; return cur; };
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const PULSE = { black: [[0, 195, 227], [99, 242, 255]], white: [[10, 185, 230], [69, 220, 255]] };
const EDGE = 64;

/** Scroll position after a focus change, the way the plugin's keepInView does it (64 px from the edges). */
function follow(s, a, b, size, max) {
  if (a - s < EDGE) s = a - EDGE; else if (b - s > size - EDGE) s = b - (size - EDGE);
  return clamp(s, 0, max);
}
/** [time, scroll] for the row and the grid, measured on the real layout once. */
let rowPlan, gridPlan, panePlan;
function plans() {
  if (rowPlan) return;
  const tiles = [...row.children];
  rowPlan = [[0, 0]];
  let s = 0;
  for (const [t, r, i] of FOCUS) {
    if (r !== "tiles") continue;
    s = follow(s, tiles[i].offsetLeft, tiles[i].offsetLeft + tiles[i].offsetWidth, row.clientWidth, row.scrollWidth - row.clientWidth);
    rowPlan.push([t, s]);
  }
  // The grid's tiles change with the sort order, so it's laid out for each event in turn.
  gridPlan = [[0, 0]];
  s = 0;
  for (const [t, i] of LFOCUS) {
    const [st, order] = lastBefore(SORTS, t);
    showSort(order);
    if (st === t) s = 0; // a new order starts at the top
    const el = grid.children[i];
    s = follow(s, el.offsetTop, el.offsetTop + el.offsetHeight, grid.clientHeight, grid.scrollHeight - grid.clientHeight);
    gridPlan.push([t, s]);
  }
  // My Page's right side scrolls only within a section; a new section starts at the top.
  panePlan = [[0, 0]];
  s = 0;
  let tab = null;
  for (const [t, area, i] of PFOCUS) {
    if (tabAt(t) !== tab) { tab = tabAt(t); s = 0; showTab(tab); }
    if (area === "pane") {
      const el = paneItems()[i];
      s = follow(s, el.offsetTop, el.offsetTop + el.offsetHeight, pane.clientHeight, pane.scrollHeight - pane.clientHeight);
    }
    panePlan.push([t, s]);
  }
}
function scrollAt(p, t) {
  let prev = 0, cur = p[0];
  for (const e of p) if (e[0] <= t) { prev = cur[1]; cur = e; }
  return prev + (cur[1] - prev) * ease((t - cur[0]) / 0.28);
}
/** Long titles end where the tiles end (the plugin's fitLabel), measured at the scroll the row is heading to. */
function fit(box, p, t, axisX) {
  for (const label of box.querySelectorAll(".s2d-label")) label.style.transform = "";
  const focused = box.querySelector(".s2d-focused");
  if (!focused) return;
  const label = focused.querySelector(".s2d-label");
  const target = (p.filter((e) => e[0] <= t).pop() ?? [0, 0])[1];
  const edge = box.getBoundingClientRect().right - parseFloat(getComputedStyle(box).paddingRight);
  const over = label.getBoundingClientRect().right + (axisX ? box.scrollLeft - target : 0) - edge;
  if (over > 0) label.style.transform = `translateX(${-over}px)`;
}

function frame(t) {
  plans();
  const shown = lastBefore(SCREENS, t);
  const theme = lastBefore(THEME, t)[1];
  for (const root of Object.values(SCREEN_EL)) {
    root.classList.toggle("s2d-black", theme === "black");
    root.classList.toggle("s2d-white", theme === "white");
    root.style.opacity = "0";
    root.style.zIndex = "0";
  }
  // screen switch: a quick fade with a slight zoom, like opening a menu on the console
  const k = shown[0] > 0 ? ease((t - shown[0]) / 0.3) : 1;
  const previous = SCREENS[Math.max(0, SCREENS.indexOf(shown) - 1)];
  const incoming = SCREEN_EL[shown[1]], outgoing = SCREEN_EL[previous[1]];
  if (outgoing !== incoming) {
    outgoing.style.opacity = String(1 - k);
    outgoing.style.transform = "none";
    outgoing.style.zIndex = "1";
  }
  incoming.style.opacity = String(k);
  incoming.style.transform = `scale(${1.02 - 0.02 * k})`;
  incoming.style.zIndex = "2";
  // clock: 24-hour, then 12-hour once the settings caption mentions it
  const h12 = lastBefore(CLOCK, t)[1] === "12";
  for (const c of screen.querySelectorAll(".s2d-clock")) c.innerHTML = h12 ? '10:09<span class="s2d-ampm">AM</span>' : "10:09";

  // focus
  const [ft, frow, fi] = lastBefore(FOCUS, t);
  const [lt, li] = lastBefore(LFOCUS, t);
  showSort(lastBefore(SORTS, t)[1]);
  for (const el of home.querySelectorAll("[data-row]")) {
    el.classList.toggle("s2d-focused", el.dataset.row === frow && +el.dataset.i === fi);
  }
  for (const el of grid.children) el.classList.toggle("s2d-focused", t >= LIB_OPEN && +el.dataset.i === li);
  const [pt, parea, pi] = lastBefore(PFOCUS, t);
  showTab(tabAt(t));
  for (const el of menuItems) el.classList.toggle("s2d-focused", t >= PAGE_OPEN && parea === "menu" && +el.dataset.i === pi);
  paneItems().forEach((el, i) => el.classList.toggle("s2d-focused", t >= PAGE_OPEN && parea === "pane" && i === pi));
  // animations: pulse (1.1 s), spin (2.4 s), pop (160 ms after each focus change)
  const [lo, hi] = PULSE[theme];
  const pulse = `rgb(${mix(lo, hi, (1 - Math.cos((t * 2 * Math.PI) / 1.1)) / 2).join(",")})`;
  const lastMove = Math.max({ library: lt, mypage: pt, home: ft }[shown[1]], shown[0]);
  for (const root of Object.values(SCREEN_EL)) {
    root.style.setProperty("--pulse", pulse);
    root.style.setProperty("--spin", `${((t / 2.4) % 1) * 360}deg`);
    root.style.setProperty("--pop", String(1.06 - 0.06 * ease((t - lastMove) / 0.16)));
  }
  // scrolling
  row.scrollLeft = scrollAt(rowPlan, t);
  grid.scrollTop = scrollAt(gridPlan, t);
  pane.scrollTop = scrollAt(panePlan, t);
  fit(row, rowPlan, t, true);
  fit(grid, gridPlan, t, false);
  // footer callouts
  for (const [name, root] of Object.entries(SCREEN_EL)) {
    for (const hint of root.querySelectorAll(".s2d-hint")) {
      const c = CALLOUTS.find(([a, b, s, g]) => t >= a && t <= b && s === name && hint.dataset.glyph === g);
      hint.classList.toggle("s2d-callout", Boolean(c));
      hint.style.setProperty("--callout", c ? String(1 + 0.07 * Math.max(0, Math.sin(((t - c[0]) * 2 * Math.PI) / 1.25))) : "1");
    }
  }

  if (!document.body.classList.contains("video")) return;
  // title card, screen fade-in, outro
  const title = document.getElementById("title"), outro = document.getElementById("outro");
  title.style.opacity = String(t < 3.4 ? ease(t / 0.6) : 1 - ease((t - 3.4) / 0.6));
  title.style.transform = `scale(${1 + 0.02 * (t / 4)})`;
  const sIn = ease((t - 4.0) / 0.8), sOut = 1 - ease((t - (OUTRO - 1.1)) / 0.8);
  screen.style.opacity = String(Math.min(sIn, sOut));
  screen.style.transform = `scale(${1.15 * (0.97 + 0.03 * sIn)})`;
  outro.style.opacity = String(ease((t - OUTRO) / 0.8) * (1 - ease((t - (DURATION - 0.8)) / 0.8)));
  // theme-change dips
  let dip = 0;
  for (const d of DIPS) dip = Math.max(dip, 1 - Math.abs(t - (d + 0.3)) / 0.3);
  document.getElementById("dip").style.opacity = String(clamp(dip, 0, 1) * 0.85);
  // captions
  const cap = CAPTIONS.find(([a, b]) => t >= a && t < b);
  const capEl = document.getElementById("caption");
  if (cap) {
    capEl.innerHTML = cap[2];
    const fade = Math.min(ease((t - cap[0]) / 0.35), 1 - ease((t - (cap[1] - 0.3)) / 0.3));
    capEl.style.opacity = String(fade);
    capEl.style.transform = `translateY(${(1 - ease((t - cap[0]) / 0.35)) * 12}px)`;
  } else capEl.style.opacity = "0";
}

const params = new URLSearchParams(location.search);
if (params.get("mode") === "video") document.body.classList.add("video");
// The stylesheet sizes everything in vh; convert to px so 100vh = the 800 px screen, whatever the page size.
const sheet = document.querySelectorAll("style")[0];
sheet.textContent = sheet.textContent.replace(/(-?\d*\.?\d+)vh/g, (_, n) => `${(parseFloat(n) * 8).toFixed(2)}px`);
window.frame = frame;
window.DURATION = DURATION;
// For the soundtrack: focus moves on both screens, sort changes, screen switches, theme changes and the outro.
const inLibrary = (x) => (x >= LIB_OPEN && x < LIB_CLOSE) || (x >= PAGE_OPEN && x < PAGE_CLOSE);
window.EVENTS = {
  duration: DURATION,
  focus: [...FOCUS.map((f) => f[0]).filter((x) => !inLibrary(x)), ...LFOCUS.map((f) => f[0]).filter((x) => x > LIB_OPEN), ...PFOCUS.map((f) => f[0]).filter((x) => x > PAGE_OPEN), ...CLOCK.map((c) => c[0])]
    .filter((x) => x > 0)
    .sort((a, b) => a - b),
  screens: SCREENS.map((s) => s[0]).filter((x) => x > 0),
  theme: THEME.map((x) => x[0]).filter((x) => x > 0),
  outro: OUTRO,
};
window.ready = Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
frame(parseFloat(params.get("t") ?? "0"));
</script>
</body>
